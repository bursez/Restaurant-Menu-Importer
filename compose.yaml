services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu_importer}
      POSTGRES_USER: ${POSTGRES_USER:-menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menu}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu} -d ${POSTGRES_DB:-menu_importer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://menu:menu@db:5432/menu_importer}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY:-}
      APP_GEMINI_MODEL: ${APP_GEMINI_MODEL:-gemini-2.5-flash}
      APP_GEMINI_USE_FAKE: ${APP_GEMINI_USE_FAKE:-false}
      APP_GEMINI_REQUEST_TIMEOUT_SECONDS: ${APP_GEMINI_REQUEST_TIMEOUT_SECONDS:-30}
      APP_GEMINI_MAX_RETRIES: ${APP_GEMINI_MAX_RETRIES:-2}
      APP_GEMINI_MIN_CONFIDENCE: ${APP_GEMINI_MIN_CONFIDENCE:-0.55}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-false}
      APP_RATE_LIMIT_REQUESTS: ${APP_RATE_LIMIT_REQUESTS:-120}
      APP_RATE_LIMIT_WINDOW_SECONDS: ${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_URL_EXTRACTION_TIMEOUT_SECONDS: ${APP_URL_EXTRACTION_TIMEOUT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
