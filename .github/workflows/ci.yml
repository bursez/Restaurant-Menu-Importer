name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, format, types, security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy type check
        run: mypy app tests

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r app

  backend-tests:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: menu_importer_test
          POSTGRES_USER: menu
          POSTGRES_PASSWORD: menu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menu -d menu_importer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install PDF and OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocrmypdf tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run database migrations
        env:
          APP_DATABASE_URL: postgresql+asyncpg://menu:menu@127.0.0.1:5432/menu_importer_test
        run: alembic upgrade head

      - name: Check migration drift
        env:
          APP_DATABASE_URL: postgresql+asyncpg://menu:menu@127.0.0.1:5432/menu_importer_test
        run: alembic check

      - name: Run backend tests with coverage
        env:
          APP_DATABASE_URL: postgresql+asyncpg://menu:menu@127.0.0.1:5432/menu_importer_test
        run: pytest --cov=app --cov-report=term-missing

  frontend-quality:
    name: Frontend lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Vitest unit tests
        run: npm run test

      - name: TypeScript check and Vite build
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up --build --detach

      - name: Wait for API health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  playwright-smoke:
    name: Playwright E2E smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Compose stack
        run: docker compose up --build --detach

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run e2e

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
