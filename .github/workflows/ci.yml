name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: menu_importer_test
          POSTGRES_USER: menu
          POSTGRES_PASSWORD: menu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menu -d menu_importer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF and OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocrmypdf tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run database migrations
        env:
          APP_DATABASE_URL: postgresql+asyncpg://menu:menu@127.0.0.1:5432/menu_importer_test
        run: alembic upgrade head

      - name: Run backend smoke tests
        env:
          APP_DATABASE_URL: postgresql+asyncpg://menu:menu@127.0.0.1:5432/menu_importer_test
        run: pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend
