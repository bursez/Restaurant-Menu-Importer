[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-menu-importer-backend"
version = "0.1.0"
description = "FastAPI backend for the Restaurant Menu Importer."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.115,<1.0",
    "greenlet>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "lxml>=5.3,<6.0",
    "lxml_html_clean>=0.4,<1.0",
    "pdfplumber>=0.11,<1.0",
    "pillow>=11.0,<12.0",
    "pydantic-settings>=2.6,<3.0",
    "pymupdf>=1.25,<2.0",
    "pytesseract>=0.3,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "readability-lxml>=0.8,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7,<2.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "ASYNC"]
ignore = ["B008", "B026", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603", "B607"]
